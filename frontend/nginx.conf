# Serves the SPA and forwards API calls to the backend, so the browser talks to one origin.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080;
        # The agent can take a while (several LLM calls); embedding a reindex even longer.
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://api:8080;
    }

    location / {
        try_files $uri /index.html;
    }
}
